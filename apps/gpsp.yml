longDescription: |
  The fast GBA emulator with SH-4A JIT for CASIO graphing calculators, now comes to ClassPad!
  - Touch-friendly Material 3 UI + physical keypad support
  - In-app Backlighting / PWM / Overclocking settings
  - V-Sync support for a smooth gameplay
  - Portrait & Landscape layouts with on-screen controls
  - 10 per-game savestate slots, SRAM/Flash/EEPROM saves, and RTC support
  - Bundled open-source GBA BIOS (no external BIOS required)
