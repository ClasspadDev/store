longDescription: |
  The J2ME real-time strategy game, now on ClassPad!
  There are two versions of the game: Art of War 2: Global Confederation, where the player plays the Confederation army, and Art of War 2: Liberation of Peru, where the player plays the Liberation army.
  You will need both .hh3 (program) and .pix (resources) files under the root directory to play.
  - Use arrow keys or 2/4/6/8 to navigate.
  - Keyboard & Backspace functions as left & right softkey.
  - Full touchscreen support. tap to select or order, drag to pan, hold then drag to box-select, long press on selected unit for action menus, etc. Touchscreen keys (Settings/Menu/Main & Swap/Rotate/Esc) also work as left & right softkeys.
